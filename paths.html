<html lang="en">
<head>

<link rel="icon" href="data:,">

</head>
<body>

<nav class="navbar">
  <div class="container">

    <div class="nav-links">
      <a href="index.html" data-page="index.html">Home</a>

<section class="section container">
  <div class="section-head">
    <div>
      <h2>Learning Paths</h2>
      <p>Complete each path to unlock the next one. Rooms inside an unlocked path can be tackled in any order — for free-choice practice instead, try the separate Challenges library.</p>
    </div>
  </div>

  <div id="path-list" style="display:flex; flex-direction:column; gap:22px;"></div>
</section>

<footer>
  <div class="container">
    <div>© 2026 Code&amp;Go — Learn Python by doing.</div>
    <div><a href="challenges.html">Challenges</a> · <a href="paths.html">Paths</a> · <a href="profile.html">Profile</a></div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/gamify.js"></script>
<script>
  function diffClass(d) {
    if (d === "Easy") return "tag-easy";
    if (d === "Medium") return "tag-medium";
    return "tag-hard";
  }

  function renderPathCard(path, unlocked) {
    const doneCount = pathCompletedCount(path);
    const totalRooms = path.rooms.length;
    const pct = Math.round((doneCount / totalRooms) * 100);
    const totalPathPoints = path.rooms.reduce((sum, rid) => sum + roomTotalPoints(getRoom(rid)), 0);
    const isDone = doneCount === totalRooms;
    const pathPremiumLocked = unlocked && path.premium && !isUserPremium();

    const roomRows = path.rooms.map((rid, i) => {
      const room = getRoom(rid);
      const done = roomIsComplete(room);
      const roomPremiumLocked = unlocked && isRoomPremium(rid) && !isUserPremium();
      const tag = unlocked ? "a" : "div";
      const href = unlocked ? `href="challenge.html?id=${room.id}"` : "";
      const rowIcon = !unlocked ? "🔒" : (roomPremiumLocked ? "💎" : (done ? "✅" : (i + 1)));
      return `
        <${tag} ${href} class="room-card ${!unlocked ? 'locked' : (roomPremiumLocked ? 'premium-locked' : '')}" style="display:flex; flex-direction:row; align-items:center; gap:14px; padding:14px 16px;">
          <div style="font-size:1.4rem; width:34px; text-align:center;">${rowIcon}</div>
          <div style="flex:1;">
            <div style="font-weight:700;">${!unlocked ? "🔒" : (roomPremiumLocked ? "💎" : room.icon)} ${room.title}</div>
            <div style="color:var(--text-dim); font-size:0.82rem;">${room.description}</div>
          </div>
          <span class="tag ${roomPremiumLocked ? 'tag-premium' : diffClass(room.difficulty)}">${roomPremiumLocked ? 'PREMIUM' : room.difficulty}</span>
          <span class="room-points">${roomTotalPoints(room)} pts</span>
        </${tag}>`;
    }).join("");

    let statusTag;
    if (!unlocked) statusTag = '<span class="tag tag-hard">LOCKED</span>';
    else if (pathPremiumLocked) statusTag = '<span class="tag tag-premium">💎 PREMIUM</span>';
    else if (isDone) statusTag = '<span class="tag tag-easy">✔ COMPLETE</span>';
    else statusTag = '<span class="tag tag-medium">IN PROGRESS</span>';

    return `
      <div class="path-card ${unlocked ? '' : 'path-locked'}" id="${path.id}" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; gap:22px; align-items:flex-start;">
          <div class="path-icon">${!unlocked ? "🔒" : (pathPremiumLocked ? "💎" : path.icon)}</div>
          <div style="flex:1;">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <h3 style="margin:0;">${path.title}</h3>
              ${statusTag}
            </div>
            <p>${path.description}</p>
            ${!unlocked ? `<p style="color:var(--text-dim); font-size:0.85rem;">🔒 Finish the path above to unlock this one.</p>` : (pathPremiumLocked ? `
              <p style="color:var(--text-dim); font-size:0.85rem;">💎 This entire path requires <a href="subscribe.html">Premium</a>.</p>
            ` : `
              <div class="room-meta" style="margin-bottom:8px;">
                <span>${doneCount}/${totalRooms} rooms complete</span>
                <span class="room-points">${totalPathPoints} pts total</span>
              </div>
              <div class="progress-bar"><span style="width:${pct}%"></span></div>
            `)}
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
          ${roomRows}
        </div>
      </div>`;
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const ok = await requireAuth();
    if (!ok) return;

    document.getElementById("path-list").innerHTML = PATH_ORDER
      .map(id => getPath(id))
      .filter(Boolean)
      .map(path => renderPathCard(path, isPathUnlocked(path.id)))
      .join("");
  });
</script>
</body>
</html>
